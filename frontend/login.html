<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TAIC app — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      color: #e8e8f0;
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-logo img {
      height: 28px;
      opacity: 0.9;
    }

    h1 {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
    }

    input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 300;
      color: #e8e8f0;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.09);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }

    button {
      margin-top: 4px;
      background: rgba(255,255,255,0.9);
      color: #080810;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); background: rgba(255,255,255,0.75); }
    button:disabled { opacity: 0.4; cursor: default; }

    .login-error {
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: #f87171;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="/icons/genius_taic_logo.png" alt="TAIC" />
    <h1>Connexion</h1>
  </div>

  <div class="login-form">
    <label>
      Email
      <input type="email" id="emailInput" placeholder="vous@exemple.com" autocomplete="email" />
    </label>
    <label>
      Mot de passe
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
    </label>
    <button id="loginBtn" onclick="handleLogin()">Accéder</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script>
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? `http://${location.hostname}:8080`
    : '';

  // Redirect si déjà connecté
  if (localStorage.getItem('whisperer_token')) {
    location.replace('/index.html');
  }

  async function handleLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');

    errEl.textContent = '';
    if (!email || !password) {
      errEl.textContent = 'Veuillez remplir tous les champs.';
      return;
    }

    btn.disabled = true;
    btn.textContent = '…';

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        errEl.textContent = err.detail || 'Erreur de connexion.';
        return;
      }

      const data = await res.json();
      localStorage.setItem('whisperer_token', data.token);
      location.replace('/index.html');
    } catch (e) {
      errEl.textContent = 'Serveur inaccessible.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Accéder';
    }
  }

  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('passwordInput').focus();
  });
</script>

</body>
</html>
