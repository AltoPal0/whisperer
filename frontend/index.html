<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TAIC app" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>TAIC app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <div class="noise-overlay"></div>
  <div class="radial-glow" id="radialGlow"></div>

  <!-- Overlay de rechargement -->
  <div class="reload-overlay" id="reloadOverlay" aria-hidden="true">
    <svg class="reload-spinner" viewBox="0 0 50 50">
      <circle cx="25" cy="25" r="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
      <circle cx="25" cy="25" r="20" fill="none" stroke="white" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="30 100"/>
    </svg>
  </div>

  <header class="app-header">
    <button class="logo-btn" id="logoBtn" aria-label="Recharger l'application">
      <img src="/icons/genius_taic_logo.png" alt="TAIC" class="app-logo" />
    </button>
    <div class="header-right">
      <span class="version-tag" id="versionTag"></span>
      <div class="status-dot" id="statusDot"></div>
    </div>
  </header>

  <main class="app-main">

    <div class="orb-zone">
      <!-- Pulse rings (idle only) -->
      <div class="pulse-ring ring-1" aria-hidden="true"></div>
      <div class="pulse-ring ring-2" aria-hidden="true"></div>
      <div class="pulse-ring ring-3" aria-hidden="true"></div>

      <!-- Processing arc spinner (SVG overlay) -->
      <svg class="spinner-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle
          class="spinner-track"
          cx="100" cy="100" r="94"
          fill="none"
          stroke-width="2"
        />
        <circle
          class="spinner-arc"
          cx="100" cy="100" r="94"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-dasharray="80 510"
        />
      </svg>

      <button class="record-btn" id="recordBtn" aria-label="Enregistrer">

        <!-- Microphone icon (idle + processing) -->
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="21" x2="15" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>

        <!-- Equalizer bars (recording only) -->
        <div class="eq-bars" aria-hidden="true">
          <span class="eq-bar bar-1"></span>
          <span class="eq-bar bar-2"></span>
          <span class="eq-bar bar-3"></span>
          <span class="eq-bar bar-4"></span>
          <span class="eq-bar bar-5"></span>
        </div>

      </button>
    </div>

    <!-- Timer (visible pendant recording) -->
    <div class="rec-timer" id="recTimer" aria-live="polite">00:00</div>

    <!-- Message d'état -->
    <p class="state-label" id="stateLabel">Appuyer pour enregistrer</p>

    <!-- Liste des transcriptions -->
    <section class="transcriptions-section">
      <div class="transcriptions-list" id="transcriptionsList">
        <!-- Cards injectées par ui.js -->
      </div>
      <p class="empty-hint" id="emptyHint">Tes notes apparaîtront ici</p>
    </section>

  </main>

  <script src="/js/version.js" defer></script>
  <script src="/js/recorder.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
